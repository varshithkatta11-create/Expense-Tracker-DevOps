
services:
  db:
    image: mysql:8.4
    container_name: expense-mysql
    environment:
      MYSQL_DATABASE: expensedb
      MYSQL_USER: expenseuser
      MYSQL_PASSWORD: expensepass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - expense_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pexpensepass"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: expense-tracker-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/expensedb
      SPRING_DATASOURCE_USERNAME: expenseuser
      SPRING_DATASOURCE_PASSWORD: expensepass
    depends_on:
      db:
        condition: service_healthy

volumes:
  expense_data:
